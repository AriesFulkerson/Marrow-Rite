plugins { id 'com.android.application' }
android {
    namespace 'com.marrowrite.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.marrowrite.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    androidResources { noCompress += ['html', 'jpg'] }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
